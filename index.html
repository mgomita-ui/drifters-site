<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ドリフターズ（お試し版）。会社はつぶやくだけ。AIで自分のプロダクトを作ってきたドリフターが提案し、形にします。">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ドリフターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;700&display=swap">
<style>
/* IFBOX と同じ色：温白の地、紺＝人の確定、空色＝AIの準備、コーラル＝参加の入口、金＝価値 */
:root{
  --bg:#FFFDF7; --surface:#FFFFFF; --sunken:#F6F1E4; --ink:#1D2433; --muted:#4A5468; --line:#E8E2D3;
  --accent:#0E2A5B; --accent-ink:#FFFFFF; --accent-soft:#E4EAF5; --sand:#FFF3D9; --draft:#1F86C4;
  --cta:#E85B52; --cta-ink:#FFFFFF; --gold:#F6A623; --gold-deep:#8F5A08;
  --ok:#2E7D52; --ok-soft:#DFF2E7; --warn:#8F5A08; --warn-soft:#FFF3D9; --info:#1F6FA8; --info-soft:#E1F1FB;
  --shadow:0 2px 6px rgba(29,36,51,.06),0 10px 28px rgba(29,36,51,.08);
  --head:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141821; --surface:#1C2130; --sunken:#171B26; --ink:#EEF0F5; --muted:#A4ACBD; --line:#2E3445;
  --accent:#9DB8F2; --accent-ink:#0B1530; --accent-soft:#222D48; --sand:#3A2F17; --draft:#6CC3F5;
  --cta:#F07A72; --cta-ink:#2A0D0B; --gold:#F6B94A; --gold-deep:#F6C46A;
  --ok:#6BC58C; --ok-soft:#18301F; --warn:#F6C46A; --warn-soft:#3A2F17; --info:#7CC4F0; --info-soft:#17293A;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141821; --surface:#1C2130; --sunken:#171B26; --ink:#EEF0F5; --muted:#A4ACBD; --line:#2E3445;
  --accent:#9DB8F2; --accent-ink:#0B1530; --accent-soft:#222D48; --sand:#3A2F17; --draft:#6CC3F5;
  --cta:#F07A72; --cta-ink:#2A0D0B; --gold:#F6B94A; --gold-deep:#F6C46A;
  --ok:#6BC58C; --ok-soft:#18301F; --warn:#F6C46A; --warn-soft:#3A2F17; --info:#7CC4F0; --info-soft:#17293A;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.75;padding-inline:16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 64px}
h1,h2,h3{text-wrap:balance;line-height:1.4;margin:0;font-family:var(--head);color:var(--accent)}
h2{font-size:24px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:Inter,"Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:800;font-size:21px;color:var(--accent);display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-family:Inter,sans-serif;font-weight:700}
.logo small{font-family:Inter,sans-serif;font-size:10px;color:var(--muted);letter-spacing:.14em;font-weight:500}
.roles{margin-left:auto;display:flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.roles button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted);padding-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:12px}

section{padding-top:44px;display:grid;gap:16px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--cta);border:1px solid var(--cta);border-radius:999px;padding:1px 12px;justify-self:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.hero{padding-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(30px,4.4vw,46px);letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--cta)}
.hero .lead{font-size:16px;margin-top:16px;max-width:32em;color:var(--muted)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.fact{background:var(--sand);color:var(--gold-deep);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.photo{position:relative}
.photo img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:20px;background:var(--sunken)}
.photo .float{position:absolute;left:-18px;bottom:-22px;width:min(300px,80%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:6px}
.photo .float .q{border:2px solid var(--cta);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--accent);font-size:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.photo .float{left:12px}}
.caption{font-size:12px;color:var(--muted)}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:f}
.flow article{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;align-content:start;counter-increment:f}
.flow img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--sunken)}
.flow .fx{padding:12px 14px 14px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.flow .fx b{font-family:var(--head);font-size:16px;color:var(--accent);display:flex;gap:8px;align-items:center}
.flow .fx b::before{content:counter(f);width:24px;height:24px;border-radius:50%;background:var(--cta);color:var(--cta-ink);display:grid;place-items:center;font-family:Inter,sans-serif;font-size:13px;flex:none}
@media (max-width:860px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.flow{grid-template-columns:1fr}}

.ideas-intro{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:center}
.ideas-intro img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;display:block;background:var(--sunken)}
.ideas-intro .big{font-family:var(--head);font-weight:800;font-size:clamp(22px,3vw,30px);color:var(--accent);line-height:1.45}
.ideas-intro .big em{font-style:normal;color:var(--cta)}
@media (max-width:760px){.ideas-intro{grid-template-columns:1fr}}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start}
.icard .say{font-family:var(--head);font-weight:700;font-size:17px;color:var(--accent);line-height:1.5}
.icard .say::after{content:"面白くないですか？";display:block;font-size:13px;color:var(--cta);font-weight:700;margin-top:2px}
.icard .by{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.icard .av{width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--gold-deep);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink)}

.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:700}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.row4{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-weight:700;font-size:14px}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.lg{padding:12px 26px;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:3px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--warn-soft);color:var(--warn)}
.s-wait{background:var(--info-soft);color:var(--info)}
.s-run{background:var(--accent-soft);color:var(--accent)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-bill{background:var(--sunken);color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}

.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.pcard.attn{border-color:var(--accent)}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.phead h3{font-size:17px}
.who-for{font-size:13px;color:var(--muted)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.seats{grid-template-columns:1fr}}
.seat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px;font-size:13px}
.seat.open{border-style:dashed}
.seat .sn{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.seat .share{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-weight:500}
.seat .holder{color:var(--ink)}
.seat.open .holder{color:var(--warn)}

.meter{display:grid;gap:4px;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}

.box{background:var(--sunken);border-radius:6px;padding:12px;font-size:14px;display:grid;gap:6px}
.box.ai{border-left:3px dashed var(--draft)}
.ai-label{font-size:12px;color:var(--draft);font-weight:700;letter-spacing:.04em}
.updates{display:grid;gap:6px}
.upd{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.upd .by{color:var(--muted);white-space:nowrap}
.inline{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.olist{display:grid;gap:4px;font-size:13px}
.orow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}

.tpl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start}
.tpl .cmp{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.tpl .cmp s{color:var(--muted)}

.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pipe div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.pipe b{display:block;font-size:22px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--sunken)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

.overlay{position:fixed;inset:0;background:rgba(10,15,13,.55);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:#fff;color:#1b1b1b;width:min(660px,100%);max-height:90vh;overflow:auto;border-radius:6px;padding:28px;font-size:14px}
.sheet h3{font-size:22px;letter-spacing:.3em;text-align:center;margin-bottom:18px}
.sheet table{min-width:0}
.sheet th{background:#f1f1ee;color:#555}
.sheet th,.sheet td{border-bottom:1px solid #ddd}
.sheet .tot{font-size:18px;font-weight:700}
.sheet .btn{background:#0E6B5C;border-color:#0E6B5C;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
.prop{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.prop.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.rec-tag{background:var(--sand);color:var(--gold-deep);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.res{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res-steps{display:flex;gap:4px;flex-wrap:wrap}
.res-steps span{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.res-steps span.on{background:var(--accent);color:var(--accent-ink)}
.read{font-size:14px;color:var(--accent);font-weight:500;border-left:3px solid var(--gold);padding-left:10px}
.qa{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.qa-row{display:grid;gap:4px}
.qa .ans{color:var(--ok)}
.qa-form{display:flex;gap:6px;flex-wrap:wrap}
.qa-form input{flex:1;min-width:160px}
.aibox{border:1px solid var(--draft);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.aibox > b{color:var(--draft);font-family:var(--head)}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--sunken);border-radius:8px;padding:10px 12px}
.def{border-left:4px solid var(--gold);padding:4px 0 4px 16px;display:grid;gap:8px;max-width:46em}
.def-main{font-family:var(--head);font-weight:800;font-size:clamp(18px,2.4vw,22px);color:var(--accent);line-height:1.55}
.plain-list{margin:8px 0 0;padding-left:1.3em;display:grid;gap:4px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-in">
      <div class="logo"><span class="mark">DR</span>ドリフターズ <small>AX FOR BUSINESS</small></div>
      <div class="roles" role="group" aria-label="見る立場">
        <button id="r-client" data-role="client">発注企業</button>
        <button id="r-drifter" data-role="drifter">ドリフター</button>
        <button id="r-ops" data-role="ops">運営担当</button>
      </div>
    </div>
  </header>
  <div class="note">
    <span>お試し版です。登録も支払いもありません。社名・人名・金額・配分はすべて例です。操作した内容はこのブラウザにだけ残り、ほかの人には見えません。仕組みは IFBOX と共通です。上の「発注企業／ドリフター／運営担当」で見る立場を切り替えられます。</span>
    <button class="linkbtn" id="reset">例の状態に戻す</button>
  </div>
  <main id="view"></main>
</div>
<div id="overlay-root"></div>

<script>
const TAX = 0.10;
const TODAY = "2026-09-26";
const MONTH = "2026-09";
const SEATS = [
  {k:"make",  name:"つくる",          desc:"業務の流れをAIで組み立てる"},
  {k:"check", name:"確かめて良くする", desc:"導入先の現場の立場で試し、直す点を伝える"},
  {k:"spread",name:"ひろめる",        desc:"同じ悩みの会社を探し、社内に根づかせる"},
];
const SHARE = {ops:20, make:45, check:20, spread:15};   // 配分（仮）：導入価格に対する%
// 入口は2つ。会社の「もし」にはドリフターが提案し、ドリフターの「もし」はドリフター同士で仲間を集める
const CLIENT_STAGES  = ["提案を募集中","つくって確かめる","導入・検収","型になった"];
const DRIFTER_STAGES = ["仲間を集める","申し込みを集める","つくって確かめる","導入・検収","型になった"];
const ALL_STAGES = ["提案を募集中","仲間を集める","申し込みを集める","つくって確かめる","導入・検収","型になった"];
const CHIP = {"提案を募集中":"s-new","仲間を集める":"s-wait","申し込みを集める":"s-wait","つくって確かめる":"s-run","導入・検収":"s-run","型になった":"s-done"};
const OCHIP = {"申込":"s-wait","導入待ち":"s-run","検収待ち":"s-new","検収済":"s-done","請求済":"s-bill","入金済":"s-bill"};

// 単発の依頼（値段・日数・配分はすべて仮）
const MENU = [
  {k:"img",   g:"画像",   name:"画像",             unit:"枚", price:8000,  days:3, qty:true,  desc:"商品・案内・SNS用の画像をAIで作り、仕上げて渡します"},
  {k:"img10", g:"画像",   name:"画像10枚セット",   unit:"式", price:60000, days:5, qty:false, desc:"同じ絵柄でそろえた10枚。カタログや連載に"},
  {k:"page",  g:"ページ", name:"ページ1枚",        unit:"式", price:80000, days:7, qty:false, desc:"案内・求人・キャンペーンのページを作って公開まで"},
  {k:"zukai", g:"図解",   name:"図解",             unit:"枚", price:15000, days:3, qty:true,  desc:"業務の流れや仕組みを1枚の図に"},
  {k:"slide", g:"資料",   name:"スライド（10枚まで）", unit:"式", price:50000, days:5, qty:false, desc:"提案・説明・研修のスライド"},
  {k:"doc",   g:"資料",   name:"資料PDF（8ページまで）", unit:"式", price:60000, days:7, qty:false, desc:"会社案内や手順書をPDFに"},
];
const JSHARE = {ops:20, make:65, check:15};
const MAXREV = 2;
const JSTEPS = ["依頼受付","作成中","確認中","納品済","検収済","請求済","入金済"];
const JCHIP = {"依頼受付":"s-new","作成中":"s-run","確認中":"s-wait","納品済":"s-new","検収済":"s-done","請求済":"s-bill","入金済":"s-bill"};
const M = k => MENU.find(m=>m.k===k);

function aiPrompt(p, question){
  const dr = id => `${D(id).name}（${D(id).former}、得意：${D(id).skills.join("・")}、自分で作ったプロダクト：${D(id).product.name}＝${D(id).product.desc}）`;
  const props = p.proposals.map((r,i)=>[
    `[提案${i+1}] ${D(r.by).name}さんのチーム${p.rec===i?"（担当者のおすすめ）":""}`,
    `チーム：つくる ${dr(r.by)}／確かめて良くする ${dr(r.check)}／ひろめる ${dr(r.spread)}`,
    `金額：${r.price}円（税別）　期間：約${r.weeks}週間`,
    `読み取り：${r.read||"なし"}`, `進め方：${r.text}`,
    `質問と回答：${(r.asks||[]).map(x=>`Q ${x.q} → A ${x.a||"（未回答）"}`).join(" / ")||"なし"}`].join("\n")).join("\n\n");
  return `あなたは「ドリフターズ」の相談役です。ドリフターズは、AIを使って自分のプロダクトを作り、その出来で事務局に選ばれた人（ドリフター）が、中小企業の業務を組み替えるサービスです。作った人とは別の人が必ず確かめます。
発注企業が、届いた提案のどれに頼むかを考える手助けをしてください。決めるのは企業です。1つを押しつけず、提案の中身を根拠にして比べてください。書かれていないことは推測だと分かるように書き、未回答の質問があれば、答えると判断しやすくなる点として触れてください。
日本語で、やさしい言葉で、400字前後。見出しや表は使わず、短い段落で。最後に「決める前に確かめること」を1〜2点。

会社：${p.origin}（${p.dept||"部署不明"}）
つぶやき：${p.ifText}

${props}

企業からの質問：${question}`;
}
async function askAI(p, question){
  if(!sampleFn || !question) return;
  AI[p.id]?.ctl?.abort();
  const st = AI[p.id] = {q:question, text:"", busy:true, ctl:new AbortController()};
  render();
  try{
    const {text} = await sampleFn(aiPrompt(p, question), {signal:st.ctl.signal, onText:({text})=>{ st.text = text; const el=document.getElementById("aio-"+p.id); if(el){ el.hidden=false; el.textContent=text; } }});
    st.text = text;
  }catch(e){
    st.text = e?.text || st.text;
    const code = e?.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) sampleFn = null;
    else if(code==="rate_limited") st.err = "いま混み合っています。少し時間をおいて、もう一度聞いてください。";
    else if(code==="session_expired") st.err = "claude.ai にもう一度サインインしてください。";
    else if(code==="refused") { st.text=""; st.err = "この聞き方には答えられませんでした。聞き方を変えてください。"; }
    else if(code!=="cancelled") st.err = "答えが途中で止まりました。もう一度聞いてください。";
  }finally{ st.busy = false; render(); }
}

function clientCard(p){
  const my = p.orders.find(o=>o.client===MYCLIENT);
  let body = "";
  if(p.stage==="提案を募集中"){
    body = `${resBar(p)}
      ${p.proposals.length?`<b class="small">届いた提案 ${p.proposals.length}件。質問に答えるほど、提案がくっきりします</b><div class="grid2">${p.proposals.map((_,i)=>propCard(p,i,{pick:true,answer:true})).join("")}</div>${aiPanel(p)}`
      :`<p class="small muted">ドリフターからの提案を待っています。担当の${p.coord}が、合いそうなドリフターに声をかけています。</p>`}`;
  } else if(p.stage==="申し込みを集める") body = meter(p);
  else body = seatsBox(p) + updatesBox(p);
  let mine = "";
  if(my){
    mine = `<div class="orow"><span>御社の導入 ${ochip(my.st)} <span class="num">${yen(my.price)}</span>${my.tpl?`<span class="tag">型から</span>`:""}</span>
      ${my.st==="検収待ち"?`<button class="btn sm" data-act="accept" data-id="${p.id}">検収する</button>`
      :my.st==="検収済"?`<span class="small muted">${my.accepted} 検収。月末の締めで請求書をお送りします</span>`
      :["請求済","入金済"].includes(my.st)?`<button class="btn ghost sm" data-inv="${esc(MYCLIENT)}|${my.month}">請求書を見る</button>`
      :my.st==="導入待ち"?`<span class="small muted">導入の準備中</span>`:`<span class="small muted">成立待ち</span>`}</div>`;
  }
  return `<article class="pcard ${(my&&my.st==="検収待ち")||(p.stage==="提案を募集中"&&p.proposals.length)?"attn":""}">${head(p)}
    <div class="meta"><span>担当 <b>${p.coord}</b></span>${p.price?`<span>金額 <b class="num">${yen(p.price)}</b></span>`:""}</div>
    ${body}${mine}</article>`;
}

  } else {

        :o.st==="検収待ち"?`<span class="small muted">企業の検収待ち</span>`:""}</span></div>`).join("")}</div>

/* ---------- 請求書・配分明細 ---------- */
function billRows(pred){
  const rows = [];
  S.plans.forEach(p=>p.orders.forEach(o=>{ if(pred(o)) rows.push({kind:o.tpl?"型":"計画",id:p.id,client:o.client,label:`${p.ifText} 導入`,price:o.price,ops:o.price*SHARE.ops/100,accepted:o.accepted}); }));
  S.jobs.forEach(j=>{ if(pred(j)) rows.push({kind:"単発",id:j.id,client:j.client,label:`${j.title}（${M(j.menu).name}${M(j.menu).qty?`×${j.qty}`:""}）`,price:j.price,ops:jobOps(j),accepted:j.accepted}); });
  return rows;
}
function payRowsFor(did){
  const rows = [];
  S.plans.forEach(p=>SEATS.forEach(s=>{ if(p.seats[s.k].includes(did)) p.orders.forEach(o=>{ if(o.month===MONTH) rows.push({label:p.ifText,client:o.client,role:`${seatName(s.k)} ${SHARE[s.k]}%${p.seats[s.k].length>1?`÷${p.seats[s.k].length}`:""}`,price:o.price,amt:o.price*cut(p,s.k)}); }); }));
  S.jobs.forEach(j=>{ if(j.month===MONTH && jobCut(j,did)>0) rows.push({label:`${j.title}（単発）`,client:j.client,role:[j.maker===did?`作る ${JSHARE.make}%`:"",j.checker===did?`確かめる ${JSHARE.check}%`:""].filter(Boolean).join("・"),price:j.price,amt:jobCut(j,did)}); });
  return rows;
}

    case "toplan": {

  }
  const p = P(t.dataset.id), i = +t.dataset.i;
  switch(t.dataset.act){
    case "like": { const k=p.likes.indexOf(MYCLIENT); k<0?p.likes.push(MYCLIENT):p.likes.splice(k,1); done(k<0?"「面白い」と伝えました":"取り消しました"); break; }
    case "try": { const k=p.tries.indexOf(MYCLIENT);
      if(k<0){ p.tries.push(MYCLIENT); if(!p.likes.includes(MYCLIENT)) p.likes.push(MYCLIENT); done("「うちで試したい」と伝えました。担当者から話を聞きにうかがいます"); }

    case "nudge": toast("合いそうなドリフターに知らせました（試作では送られません）"); break;
    case "join": p.orders.push({client:MYCLIENT,st:"申込",price:p.price,date:TODAY}); done("申し込みました。目標社数に届いたら作り始めます"); break;
    case "tpl":  p.orders.push({client:MYCLIENT,st:"導入待ち",price:p.tplPrice,tpl:true,date:TODAY}); done("型での導入を申し込みました。担当者から日程の連絡をします"); break;
    case "accept": { const o=p.orders.find(o=>o.client===MYCLIENT); o.st="検収済"; o.accepted=TODAY; done("検収しました。月末の締めで請求書をお送りします"); break; }

    case "takehand": {
      const h = p.hands[i], other = h.seat==="make"?"check":h.seat==="check"?"make":null;
      if(other && p.seats[other].includes(h.d)){ toast("つくる人と確かめて良くする人は、同じ人にできません"); return; }
      p.seats[h.seat].push(h.d); p.hands = p.hands.filter((x,k)=>k!==i && !(x.seat===h.seat)); done(`${D(h.d).name}さんを「${seatName(h.seat)}」に受けました`); break; }
    case "drophand": p.hands.splice(i,1); done("見送りました"); break;
    case "startorders":
      p.tries.forEach(c=>{ if(!p.orders.some(o=>o.client===c)) p.orders.push({client:c,st:"申込",price:p.price,date:TODAY}); });
      if(!p.deadline) p.deadline = addDays(TODAY,30);
      p.stage="申し込みを集める"; done("申し込みの受付を始めました。「うちで試したい」の会社を申し込みに入れました（本番では各社の確認をとります）"); break;
    case "go": p.stage="つくって確かめる"; p.orders.forEach(o=>o.st="導入待ち"); done("成立しました。ドリフターが作り始めます"); break;
    case "deliver": p.stage="導入・検収"; p.orders.forEach(o=>{ if(o.st==="導入待ち") o.st="検収待ち"; }); done("導入に進みました。検収を待ちます"); break;
    case "install": p.orders[i].st="検収待ち"; done("導入済みにしました。企業の検収を待ちます"); break;
    case "paid": p.orders[i].st="入金済"; done("入金済みにしました"); break;
    case "template":
      p.stage="型になった"; p.tplPrice=Math.max(10000,Math.round(p.price*0.6/10000)*10000); p.tplWeeks=Math.max(1,Math.ceil(p.weeks/2));
      done(`型になりました。次の会社は ${yen(p.tplPrice)}・約${p.tplWeeks}週間で導入できます`); break;
    case "close":
      S.plans.forEach(p=>p.orders.forEach(o=>{ if(o.st==="検収済" && (o.accepted||"").startsWith(MONTH)){ o.st="請求済"; o.month=MONTH; } }));

      done("9月分を締めました。請求書と配分明細を作りました"); break;
  }
});

    Object.assign(j,{maker:mk,checker:ck,st:"作成中"}); done(`${D(mk).name}さんが作り始めます`); return; }
  if(f.dataset.jobdeliver){ const j=J(f.dataset.jobdeliver);
    j.log.push({by:j.maker,t:"納品",text:$(`#jd-${j.id}`).value.trim()}); j.st="確認中"; done(`${checkerName(j.checker)}に確かめてもらいます`); return; }
  if(f.dataset.jobback){ const j=J(f.dataset.jobback);
    j.log.push({by:j.checker,t:"作り直し",text:$(`#jb-${j.id}`).value.trim()}); j.st="作成中"; done("作った人に戻しました（企業の修正回数は減りません）"); return; }
  if(f.dataset.jobrevise){ const j=J(f.dataset.jobrevise);
    j.log.push({by:"client",t:`修正${j.revisions+1}回目`,text:$(`#rv-${j.id}`).value.trim()}); j.revisions++; j.st="作成中"; done(`修正を頼みました（残り${MAXREV-j.revisions}回）`); return; }
  if(f.dataset.post){ const p=P(f.dataset.post);
    const ks = SEATS.filter(s=>p.seats[s.k].includes(MYDRIFTER)).map(s=>s.k);
    p.updates.push({seat:ks.includes("check")?"check":ks[0],d:MYDRIFTER,date:TODAY,text:$(`#up-${p.id}`).value.trim()});
    done("投稿しました。担当者と仲間に届きます"); return; }
});
$("#view").addEventListener("input",e=>{
  if(e.target.id==="j-qty" && pendingJob){ const el=$("#j-price"); if(el) el.textContent = yen(M(pendingJob).price*Math.max(1,+e.target.value||1)); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#overlay-root").innerHTML=""; });
render();
(async()=>{ try{ sampleFn = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ sampleFn = null; } render(); })();
</script>
